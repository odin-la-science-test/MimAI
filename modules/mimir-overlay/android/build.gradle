apply plugin: 'com.android.library'

group = 'fr.mimai.app'
version = '0.1.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useExpoPublishing()

/* versions Android gérées par expo-modules-core (compileSdk/minSdk/targetSdk) */
useDefaultAndroidSdkVersions()

android {
  namespace "fr.mimai.app.overlay"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
